<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Quran Ayah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ornament {
      content: url('https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Islamiccalligraphy.svg/512px-Islamiccalligraphy.svg.png');
      width: 50px;
      height: 50px;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-blue-100 flex items-center justify-center min-h-screen">
  <div class="relative bg-white shadow-xl rounded-lg p-8 max-w-3xl text-center">
    <!-- Top Decoration -->
    <div class="absolute -top-8 left-1/2 transform -translate-x-1/2">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Islamiccalligraphy.svg/512px-Islamiccalligraphy.svg.png" 
           alt="Top Ornament" class="w-16 h-16">
    </div>

    <!-- Ayah Title -->
    <div class="mb-6">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-800">
        بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ
      </h1>
    </div>

    <!-- Border with Ornaments -->
    <div class="relative border-t-2 border-gray-300 py-8">
      <div class="absolute -top-4 left-0">
        <div class="ornament"></div>
      </div>
      <div class="absolute -top-4 right-0">
        <div class="ornament"></div>
      </div>

      <!-- Ayah Content -->
      <p class="text-3xl md:text-5xl font-serif leading-relaxed text-gray-900 mb-4">
        وَإِن تَعُدُّوا۟ نِعْمَتَ ٱللَّهِ لَا تُحْصُوهَآ
      </p>
      <p class="text-gray-700 text-sm italic">
        (Surah Ibrahim: 34)
      </p>
    </div>

    <!-- Translation -->
    <div class="mt-6">
      <p class="text-lg md:text-xl text-gray-600">
        "And if you should count the favors of Allah, you could not enumerate them."
      </p>
    </div>

    <!-- Bottom Decoration -->
    <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Islamiccalligraphy.svg/512px-Islamiccalligraphy.svg.png" 
           alt="Bottom Ornament" class="w-16 h-16">
    </div>
  </div>
</body>
</html>
